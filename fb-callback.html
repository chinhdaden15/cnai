<body><div class="w"><h1>CN.AI</h1><p id="m">Returning to the CN.AI app on your computer…</p>
<p style="color:#a0a1a8;font-size:14px">CN.AI runs on your own computer. This page only hands the Facebook authorization back to the app at 127.0.0.1; nothing is stored here.</p></div>
<script>
const q = location.search;
if (/[?&](code|error)=/.test(q)) location.replace('http://127.0.0.1:8800/fb/callback' + q);
else document.getElementById('m').textContent = 'Nothing to do here. Open CN.AI and click "Continue with Facebook".';
</script></body></html>
